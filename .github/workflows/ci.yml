name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fallguard
          POSTGRES_PASSWORD: fallguard
          POSTGRES_DB: fallguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fallguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fallguard:fallguard@localhost:5432/fallguard
      JWT_SECRET: ci-test-secret-please-override-in-prod
      CSRF_SECRET: ci-test-secret-please-override-in-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: cp config.yaml.example config.yaml
      - run: alembic upgrade head
      - run: pytest tests/
